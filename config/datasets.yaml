# Public CRISPRi / Perturb-seq sources for zero-shot training.
# status: "unverified" = found by web search, file format/columns not yet confirmed.
# Fill in pert_col / control_label / gene_col after inspecting each file on BioHPC.
datasets:
  replogle_k562_essential:
    cell_line: K562
    how: "Zenodo 13350497 ReplogleWeissman2022_K562_essential.h5ad (scripts/01_fetch_public.py)"
    paper: "Replogle et al. 2022, Cell, doi:10.1016/j.cell.2022.05.013"
    status: unverified
    pert_col: gene            # check
    control_label: non-targeting
  replogle_k562_gwps:
    cell_line: K562
    how: "Zenodo 13350497 ReplogleWeissman2022_K562_gwps.h5ad (8.8 GB)"
    paper: same
    status: unverified
    pert_col: gene
    control_label: non-targeting
  replogle_rpe1:
    cell_line: RPE1
    how: "Zenodo 13350497 ReplogleWeissman2022_rpe1.h5ad"
    status: unverified
    pert_col: gene            # check
    control_label: non-targeting
  nadig_jurkat:
    cell_line: Jurkat
    how: "GEO GSE264667 suppl: GSE264667_jurkat_raw_singlecell_01.h5ad (8.7 GB; ftp.ncbi.nlm.nih.gov/geo/series/GSE264nnn/GSE264667/suppl/)"
    paper: "Nadig et al. 2025, Nature Genetics, doi:10.1038/s41588-025-02169-3"
    status: verified_format   # raw integer counts, 262,956 cells x 8,882 genes
    pert_col: gene
    control_label: non-targeting
    gene_col: gene_name       # var_names are Ensembl IDs; symbols are in var['gene_name']
    note: "Essential-gene screen (~2,393 perts). Jurkat is likely validation context A. Harmonized: 8,284 challenge genes, 2,270 perts."
  nadig_hepg2:
    cell_line: HepG2
    how: "GEO GSE264667 suppl: GSE264667_hepg2_raw_singlecell_01.h5ad (5.2 GB)"
    paper: same
    status: harmonized        # same layout assumed and accepted by 02_harmonize.py
    pert_col: gene
    control_label: non-targeting
    gene_col: gene_name
    note: "Harmonized: 9,024 challenge genes, 2,160 perts. Skip GSE264667_RAW.tar (15 GB)."
  arc_vcc2025_h1:
    cell_line: H1_hESC
    how: "gs://arc-institute-virtual-cell-atlas/virtual-cell-challenge/2025/{train,validation,test}/adata_*.h5ad (requester pays; 14.4+6.5+11.1 GB)"
    status: verified_format   # raw counts, symbols, 18,080 genes; harmonized as h1_train/h1_validation/h1_test
    chemistry: 10x Flex
    pert_col: target_gene
    control_label: non-targeting
  xatlas_orion:
    cell_line: HCT116, HEK293T
    how: "figshare DOI 10.25452/figshare.plus.29190726 (~520 GB total; take a subset)"
    paper: "bioRxiv 10.1101/2025.06.11.659105"
    status: unverified
    note: "Flex chemistry NOT confirmed; check methods."
