# Public CRISPRi / Perturb-seq sources for zero-shot training.
# status: "unverified" = found by web search, file format/columns not yet confirmed.
# Fill in pert_col / control_label / gene_col after inspecting each file on BioHPC.
datasets:
  replogle_k562_essential:
    cell_line: K562
    how: "Zenodo 13350497 ReplogleWeissman2022_K562_essential.h5ad (scripts/01_fetch_public.py)"
    paper: "Replogle et al. 2022, Cell, doi:10.1016/j.cell.2022.05.013"
    status: unverified
    pert_col: gene            # check
    control_label: non-targeting
  replogle_k562_gwps:
    cell_line: K562
    how: "Zenodo 13350497 ReplogleWeissman2022_K562_gwps.h5ad (8.8 GB)"
    paper: same
    status: unverified
    pert_col: gene
    control_label: non-targeting
  replogle_rpe1:
    cell_line: RPE1
    how: "Zenodo 13350497 ReplogleWeissman2022_rpe1.h5ad"
    status: unverified
    pert_col: gene            # check
    control_label: non-targeting
  nadig_hepg2_jurkat:      # split into two entries once downloaded (one per cell line)
    cell_line: HepG2, Jurkat
    how: "GEO GSE264667 (accession from a secondary source -- verify on GEO); Nature Genetics doi:10.1038/s41588-025-02169-3"
    status: unverified
    note: "Essential-gene CRISPRi screens only (~2,393 perts each), not genome-wide. Jurkat is likely validation context A."
  arc_vcc2025_h1:
    cell_line: H1_hESC
    how: "Arc Virtual Cell Atlas: https://arcinstitute.org/tools/virtualcellatlas (full 2025 set incl. val/test perturbations)"
    status: unverified
    chemistry: 10x Flex
    pert_col: target_gene
    control_label: non-targeting
  xatlas_orion:
    cell_line: HCT116, HEK293T
    how: "figshare DOI 10.25452/figshare.plus.29190726 (~520 GB total; take a subset)"
    paper: "bioRxiv 10.1101/2025.06.11.659105"
    status: unverified
    note: "Flex chemistry NOT confirmed; check methods."
